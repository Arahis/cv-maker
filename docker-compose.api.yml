services:
  api-staging:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.aws
    container_name: cvoop-api-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_EXTRA_CA_CERTS: /app/certs/global-bundle.pem
    volumes:
      - ./global-bundle.pem:/app/certs/global-bundle.pem:ro
    expose:
      - "4000"
    command: >
      sh -c "npx prisma migrate deploy --config apps/api/prisma.config.ts
      && npm run -w apps/api start"

  api-production:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.aws
    container_name: cvoop-api-production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_EXTRA_CA_CERTS: /app/certs/global-bundle.pem
    volumes:
      - ./global-bundle.pem:/app/certs/global-bundle.pem:ro
    expose:
      - "4000"
    command: >
      sh -c "npx prisma migrate deploy --config apps/api/prisma.config.ts
      && npm run -w apps/api start"

  caddy:
    image: caddy:2-alpine
    container_name: cvoop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-staging
      - api-production
volumes:
  caddy_data:
  caddy_config:
